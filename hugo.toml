baseURL = "http://localhost:1313/"
languageCode = "en-gb"
title = "Mackenzie Trafford"

[params]
  # description for search/social previews
  tagline = ""

  # Immich image source. photo-image.html resolves each photo's immichId
  # against this template. The API key lives ONLY in the proxy
  # (see proxy/Caddyfile.example) and in the GitHub repo secret — never in
  # client JavaScript. See scripts/import-immich.py for the full flow used by
  # the scheduled GitHub Action.
  immichBaseURL = "https://img.mushypea.win/assets/{id}/thumbnail"
  # Full-resolution variant, used on the single-photo page. The proxy must
  # allow the "original" segment (see proxy/Caddyfile.example / NPM snippet).
  immichOriginalURL = "https://img.mushypea.win/assets/{id}/original"

  # Image quality for the gallery grid.
  #   false (default) -> grid uses thumbnails, popup/lightbox uses originals.
  #   true            -> grid uses full-resolution originals too (heavier load).
  immichUseOriginal = true

  # homepage route cards
  [[params.routes]]
    tag = ""
    title = "Photography"
    subtitle = ""
    url = "/photography/"

  [[params.routes]]
    tag = ""
    title = "Projects & Builds"
    subtitle = "Ocassionally noteworthy projects."
    url = "/projects/"

  [[params.routes]]
    tag = ""
    title = "About Me"
    subtitle = "A bit about me, and how to get in touch."
    url = "/about/"

  # social links
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/mushyp3a"
    rel = true

[taxonomies]

[menu]

  [[menu.main]]
    name = "Photography"
    pageRef = "/photography"
    weight = 10

  [[menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 20

  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 30
