{{ define "main" }}

<section class="hero">
    <h1 class="hero-title">{{ site.Title }}</h1>

    {{ with .Content }}
        <div class="hero-intro content">
            {{ . }}
        </div>
    {{ end }}
</section>

<section class="routes" aria-label="Ways to explore the site">
    <div class="route-grid">
        {{ range site.Params.routes }}
            {{ partial "route-card.html" . }}
        {{ end }}
    </div>
</section>

{{ end }}
